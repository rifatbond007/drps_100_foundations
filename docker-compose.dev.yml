# ============================================
# Donation Platform — Local Development Stack
# ============================================
# Use alongside the app running locally (pnpm dev):
#   docker compose -f docker-compose.dev.yml up -d
#   pnpm dev
#
# Or run the full stack (slower rebuild):
#   docker compose -f docker-compose.dev.yml --profile full up -d
# ============================================
version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: donation-postgres-dev
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-donation}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-donation}
      - POSTGRES_DB=${POSTGRES_DB:-donation_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data
      - ./scripts/init-db.sh:/docker-entrypoint-initdb.d/01-init.sh:ro
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-donation} -d ${POSTGRES_DB:-donation_dev}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: donation-redis-dev
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis-dev-data:/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Optional: full containerized app for parity testing
  app:
    image: node:20-alpine
    container_name: donation-app-dev
    profiles: ["full"]
    working_dir: /app
    command: sh -c "corepack enable && corepack prepare pnpm@latest --activate && pnpm install --frozen-lockfile && pnpm dev"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://${POSTGRES_USER:-donation}:${POSTGRES_PASSWORD:-donation}@postgres:5432/${POSTGRES_DB:-donation_dev}
      - REDIS_URL=redis://redis:6379
      - NEXTAUTH_URL=http://localhost:3000
      - NEXTAUTH_SECRET=dev_secret_change_me_in_production_at_least_32_chars
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-dev}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-dev}
      - BKASH_BASE_URL=https://tokenized.pay.bka.sh/v1.2.0-beta/sandbox
      - BKASH_APP_KEY=${BKASH_APP_KEY:-dev}
      - BKASH_APP_SECRET=${BKASH_APP_SECRET:-dev}
      - BKASH_USERNAME=${BKASH_USERNAME:-dev}
      - BKASH_PASSWORD=${BKASH_PASSWORD:-dev}
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - app-dev-node-modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network

volumes:
  postgres-dev-data:
    driver: local
  redis-dev-data:
    driver: local
  app-dev-node-modules:
    driver: local

networks:
  app-network:
    driver: bridge
