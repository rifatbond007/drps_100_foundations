# ============================================
# Nginx app config — TLS termination + reverse proxy
# ============================================
# Domain is templated at deploy time. Replace ${DOMAIN}
# before mounting (sed in deploy script, or use envsubst).
# ============================================

# Map for rate-limited locations
map $request_uri $is_heavy {
    default 0;
    "~*/api/donations/create" 1;
    "~*/api/auth/"             1;
}

# ---------- HTTP → HTTPS ----------
server {
    listen 80;
    listen [::]:80;
    server_name ${DOMAIN} www.${DOMAIN};

    # ACME challenge — Certbot webroot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Everything else redirects to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- HTTPS ----------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ${DOMAIN} www.${DOMAIN};

    # TLS
    ssl_certificate /etc/letsencrypt/live/${DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${DOMAIN}/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP stapling
    ssl_stapling on;
    ssl_stapling_verify on;

    # Upload size (avatar upload, etc.)
    client_max_body_size 10M;

    # Security headers (also in main nginx.conf — duplicate is fine)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---------- Proxy defaults ----------
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID      $request_id;
    proxy_redirect off;
    proxy_connect_timeout 10s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;
    proxy_buffering       on;

    # ---------- Health check (no rate limit, no log) ----------
    location = /api/health {
        access_log off;
        proxy_pass http://app:3000;
    }

    # ---------- General / static ----------
    location / {
        limit_req zone=general burst=20 nodelay;
        proxy_pass http://app:3000;
    }

    # ---------- API ----------
    location /api/ {
        limit_req zone=api burst=50 nodelay;
        proxy_pass http://app:3000;
    }

    # ---------- Sensitive endpoints (stricter limit) ----------
    location ~ ^/api/(donations/create|auth/) {
        limit_req zone=auth burst=10 nodelay;
        proxy_pass http://app:3000;
    }

    # ---------- Next.js static assets (immutable, long cache) ----------
    location /_next/static/ {
        proxy_pass http://app:3000;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ---------- Public assets (favicon, robots.txt) ----------
    location ~* \.(ico|png|jpg|jpeg|gif|webp|svg|woff2?)$ {
        proxy_pass http://app:3000;
        expires 30d;
        add_header Cache-Control "public";
    }
}
