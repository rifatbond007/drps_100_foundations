name: CI

# Minimal CI for the entire codebase.
# Runs only static checks + unit tests. No E2E, no Docker build, no deploy.
# Triggered on every push and PR to main / develop / feature / fix branches.

on:
  push:
    branches: [main, develop, 'feat/**', 'fix/**']
  pull_request:
    branches: [main, develop, 'feat/**', 'fix/**']

jobs:
  ci:
    name: Format / Lint / Type-check / Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Generate Prisma client BEFORE lint/type-check so the @prisma/client
      # exports (PrismaClient, generated types) actually exist when tsc and
      # eslint resolve imports. @prisma/client ships as a stub until
      # `prisma generate` populates node_modules/.prisma/client.
      - name: Generate Prisma client
        run: pnpm prisma generate

      - name: Format check (Prettier)
        run: pnpm format:check

      - name: Lint (ESLint)
        run: pnpm lint

      - name: Type-check (tsc --noEmit)
        run: pnpm type-check

      - name: Unit tests (Vitest)
        run: pnpm test
