name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment'
        required: true
        type: choice
        default: 'staging'
        options:
          - staging
          - production

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event.inputs.environment || 'production' }}
      url: ${{ github.event.inputs.environment == 'staging' && 'https://staging.example.com' || 'https://example.com' }}

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.1.0
        env:
          IMAGE_TAG: ${{ github.sha }}
          DOMAIN: ${{ vars.DOMAIN || 'example.com' }}
          BACKUP_RETENTION_DAYS: ${{ vars.BACKUP_RETENTION_DAYS || '30' }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -euo pipefail

            APP_DIR="/opt/donation-platform"
            cd "$APP_DIR"

            log() { echo "[deploy $(date '+%F %T')] $*"; }
            fail() { echo "[deploy] ERROR: $*" >&2; exit 1; }

            log "Pre-deploy snapshot"
            docker compose ps > /tmp/before.txt || true

            log "Backing up DB before deploy"
            ./scripts/backup-db.sh || log "WARN: backup failed (continuing)"

            log "Templating nginx config with DOMAIN=${DOMAIN}"
            sed -i "s|\${DOMAIN}|${DOMAIN}|g" nginx/conf.d/app.conf

            log "Pulling new image (tag=${IMAGE_TAG:0:12})"
            export DOCKERHUB_USERNAME="${DOCKERHUB_USERNAME:-riftbond007}"
            export IMAGE_TAG="${IMAGE_TAG}"
            docker compose pull app || fail "image pull failed"

            log "Running DB migrations"
            docker compose run --rm app pnpm prisma migrate deploy || fail "migrations failed"

            log "Restarting app (rolling)"
            docker compose up -d --no-deps --scale app=2 app || true
            sleep 15
            docker compose up -d --no-deps app

            log "Reloading nginx"
            docker compose exec nginx nginx -s reload || log "WARN: nginx reload failed"

            log "Waiting for health"
            for i in {1..30}; do
              if curl -fsS --max-time 5 http://localhost:3000/api/health >/dev/null 2>&1; then
                log "✅ Health OK after ${i}s"
                break
              fi
              sleep 2
            done

            curl -fsS http://localhost:3000/api/health >/dev/null 2>&1 || fail "health check still failing"

            log "Pruning old images"
            docker image prune -f

            log "Deployment complete"

      - name: Notify Slack
        if: always()
        uses: slackapi/slack-github-action@v2
        with:
          payload: |
            {
              "text": "${{ job.status == 'success' && '✅' || '❌' }} Deploy *${{ github.event.inputs.environment || 'production' }}* ${{ job.status }}\nCommit: `${{ github.sha }}`\nAuthor: ${{ github.actor }}"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}
