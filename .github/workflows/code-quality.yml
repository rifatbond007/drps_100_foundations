name: Code Quality

on:
  pull_request:
    branches: [main, develop]

jobs:
  bundle-size:
    name: Bundle Size Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Check first-load JS size
        run: |
          # Get the largest first-load JS chunk from Next.js build output
          CHUNKS=$(find .next/static/chunks -name "*.js" -size +50k 2>/dev/null || true)
          TOTAL_BYTES=0
          for chunk in $CHUNKS; do
            SIZE=$(stat -c%s "$chunk")
            TOTAL_BYTES=$((TOTAL_BYTES + SIZE))
          done

          MAX_BYTES=209715  # 200 KB
          echo "Total first-load JS: ${TOTAL_BYTES} bytes (max: ${MAX_BYTES})"

          if [ "$TOTAL_BYTES" -gt "$MAX_BYTES" ]; then
            echo "❌ Bundle size exceeded: ${TOTAL_BYTES} > ${MAX_BYTES}"
            echo "Largest chunks:"
            echo "$CHUNKS" | head -10 | while read c; do echo "  $(stat -c%s "$c") bytes: $c"; done
            exit 1
          fi
          echo "✅ Bundle size OK"

  sonar:
    name: SonarCloud Scan
    runs-on: ubuntu-latest
    if: ${{ vars.SONAR_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: SonarCloud Scan
        uses: sonarcloud/github-action@v2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=donation-platform
            -Dsonar.organization=${{ vars.SONAR_ORG }}
            -Dsonar.sources=src
            -Dsonar.tests=src/__tests__,e2e
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info

  conventional-commits:
    name: Conventional Commits Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Lint commit messages
        uses: wagoid/commitlint-github-action@v5
        with:
          configFile: .commitlintrc.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
