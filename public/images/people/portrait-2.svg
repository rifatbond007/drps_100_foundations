<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 400" width="320" height="400" role="img" aria-label="Portrait placeholder">
  <rect width="320" height="400" fill="hsl(40, 25%, 96%)" />
  <rect x="12" y="12" width="296" height="376" fill="none" stroke="hsl(35, 12%, 18%)" stroke-width="1" opacity="0.18" />

  <!-- Mustard wash backdrop, slightly different tonal placement -->
  <rect x="40" y="60" width="240" height="280" fill="hsl(42, 60%, 78%)" opacity="0.35" />

  <!-- Shoulders (slightly wider silhouette — a different figure) -->
  <path d="M40 340 L40 312 Q40 256 116 240 L204 240 Q280 256 280 312 L280 340 Z"
        fill="hsl(35, 12%, 18%)" opacity="0.9" />

  <!-- Scarf / collar band: a hairline strip of mustard across the shoulders -->
  <rect x="60" y="276" width="200" height="14" fill="hsl(42, 70%, 48%)" />

  <!-- Neck -->
  <rect x="142" y="222" width="36" height="40" fill="hsl(35, 12%, 18%)" opacity="0.85" />

  <!-- Head: rounded but not a perfect oval — gives the silhouette variety -->
  <path d="M100 170 Q100 100 160 100 Q220 100 220 170 Q220 230 200 244 L120 244 Q100 230 100 170 Z"
        fill="hsl(35, 22%, 76%)" />

  <!-- Hair pulled back: a flat darker cap, narrower than portrait 1 -->
  <path d="M108 158 Q108 104 160 104 Q212 104 212 158 L212 144 Q200 122 160 122 Q120 122 108 144 Z"
        fill="hsl(35, 12%, 18%)" opacity="0.88" />

  <!-- Small earring dot, the only micro-detail on the figure -->
  <circle cx="220" cy="180" r="3" fill="hsl(42, 70%, 48%)" />

  <text x="24" y="378" font-family="serif" font-size="20" font-weight="700"
        fill="hsl(35, 12%, 18%)" letter-spacing="2">02</text>
</svg>
